<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0">{{ isEdit ? '✏️ Editar' : '➕ Nueva' }} Farmacia</h5>
        </div>
        <div class="card-body">
          <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

          <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label">Nombre *</label>
              <input 
                type="text" 
                class="form-control" 
                [(ngModel)]="farmacia.nombre" 
                name="nombre" 
                required>
            </div>

            <div class="mb-3">
              <label class="form-label">Dirección *</label>
              <input 
                type="text" 
                class="form-control" 
                [(ngModel)]="farmacia.direccion" 
                name="direccion" 
                required>
            </div>

            <div class="mb-3">
              <label class="form-label">Teléfono *</label>
              <input 
                type="text" 
                class="form-control" 
                [(ngModel)]="farmacia.telefono" 
                name="telefono" 
                required>
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <input 
                type="email" 
                class="form-control" 
                [(ngModel)]="farmacia.email" 
                name="email">
            </div>

            <div class="d-flex justify-content-between">
              <a routerLink="/farmacias" class="btn btn-secondary">Cancelar</a>
              <button type="submit" class="btn btn-primary" [disabled]="loading">
                {{ loading ? 'Guardando...' : (isEdit ? 'Actualizar' : 'Guardar') }}
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
