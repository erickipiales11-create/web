<div class="container mt-4">
  <h2>📊 Gestión de Movimientos</h2>
  
  <div *ngIf="loading" class="text-center my-5">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div *ngIf="!loading && movimientos.length === 0" class="alert alert-info">
    No hay movimientos registrados.
  </div>

  <div class="table-responsive" *ngIf="!loading && movimientos.length > 0">
    <table class="table table-striped table-hover">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Medicamento ID</th>
          <th>Tipo</th>
          <th>Cantidad</th>
          <th>Fecha</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let movimiento of movimientos">
          <td>{{ movimiento.id }}</td>
          <td>{{ movimiento.medicamentoId }}</td>
          <td>
            <span [class.text-success]="movimiento.tipo === 'entrada'" 
                  [class.text-danger]="movimiento.tipo === 'salida'">
              {{ movimiento.tipo | uppercase }}
            </span>
          </td>
          <td>{{ movimiento.cantidad }}</td>
          <td>{{ movimiento.fecha | date:'dd/MM/yyyy' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
