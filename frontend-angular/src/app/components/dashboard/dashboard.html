<div class="container-fluid mt-4">
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
          <h5 class="mb-0">🏥 Panel de Control</h5>
          <button class="btn btn-light btn-sm" (click)="logout()">Cerrar Sesión</button>
        </div>
        <div class="card-body">
          <h5>Bienvenido, {{ user?.nombre || 'Usuario' }}</h5>
          <p class="text-muted">Sistema de Gestión Clínica</p>
          
          <div class="row mt-4">
            <div class="col-md-3 col-sm-6 mb-3">
              <div class="card bg-primary text-white">
                <div class="card-body text-center">
                  <h2>{{ medicamentosCount }}</h2>
                  <h6>Medicamentos</h6>
                  <a routerLink="/medicamentos" class="text-white">Ver todos →</a>
                </div>
              </div>
            </div>
            <div class="col-md-3 col-sm-6 mb-3">
              <div class="card bg-info text-white">
                <div class="card-body text-center">
                  <h2>{{ farmaciasCount }}</h2>
                  <h6>Farmacias</h6>
                  <a routerLink="/farmacias" class="text-white">Ver todas →</a>
                </div>
              </div>
            </div>
            <div class="col-md-3 col-sm-6 mb-3">
              <div class="card bg-warning text-white">
                <div class="card-body text-center">
                  <h2>📋</h2>
                  <h6>Categorías</h6>
                  <a routerLink="/categorias" class="text-white">Ver todas →</a>
                </div>
              </div>
            </div>
            <div class="col-md-3 col-sm-6 mb-3">
              <div class="card bg-danger text-white">
                <div class="card-body text-center">
                  <h2>📊</h2>
                  <h6>Movimientos</h6>
                  <a routerLink="/movimientos" class="text-white">Ver todos →</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
